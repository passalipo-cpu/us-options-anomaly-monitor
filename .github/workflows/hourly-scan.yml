name: Hourly Options Scan

on:
  schedule:
    # UTC window covers the New York 09:30-16:00 session across DST changes.
    - cron: '45 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: options-anomaly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run unit tests
        run: python -m pytest -q
      - name: Ensure cache directory exists
        run: mkdir -p data && touch data/options.db
      - name: Restore SQLite cache
        uses: actions/cache/restore@v4
        with:
          path: data/options.db
          key: options-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            options-db-${{ runner.os }}-
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: '0'
          ALERT_SCORE: '65'
        run: python -m src.main
      - name: Save SQLite cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/options.db
          key: options-db-${{ runner.os }}-${{ github.run_id }}
