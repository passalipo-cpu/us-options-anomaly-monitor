name: Hourly Options Scan

on:
  schedule:
    # Broad UTC window covers New York regular hours across DST changes.
    - cron: '45 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: options-anomaly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run unit tests
        run: python -m pytest -q
      - name: Ensure cache and report directories exist
        run: mkdir -p data reports && touch data/options.db
      - name: Restore SQLite cache
        uses: actions/cache/restore@v5
        with:
          path: data/options.db
          key: options-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            options-db-${{ runner.os }}-
      - name: Run scanner, generate reports and send notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: passalipo@gmail.com
          EMAIL_HOST: smtp.gmail.com
          EMAIL_PORT: '587'
          DRY_RUN: '0'
          ALERT_SCORE: '65'
          MAX_EXPIRATIONS: '4'
        run: python -m src.main
      - name: Save SQLite cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/options.db
          key: options-db-${{ runner.os }}-${{ github.run_id }}
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: options-scan-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
